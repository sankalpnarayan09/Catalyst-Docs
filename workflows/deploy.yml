name: Deploy Catalyst Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Inject Secrets into script.js
        run: |
          sed -i 's/__BIN_ID__/${{ secrets.BIN_ID }}/g' script.js
          sed -i 's/__API_KEY__/${{ secrets.API_KEY }}/g' script.js
          sed -i 's/__GEMINI_API_KEY__/${{ secrets.GEMINI_API_KEY }}/g' script.js

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    needs: build
    runs-on: node-latest if needed, or runs-on: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
